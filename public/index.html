<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solstice Casino</title><link rel="icon" href="/logo.png">
<style>
:root{--bg:#07060b;--bg2:#0f0d18;--card:#14111f;--line:#2a2440;--text:#eee9ff;--mut:#8f88aa;--gold:#f5c542;--pink:#ff2bd6;--cyan:#27e8ff;--green:#2dff9b;--red:#ff4466}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,#2a0f4a55,transparent),radial-gradient(700px 400px at -10% 110%,#00e5ff18,transparent),var(--bg)}
h1,h2,h3,.disp{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.5px}
button,input,select{font:inherit;color:inherit}
input,select{background:#0b0914;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #27e8ff22}
label{display:block;color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:12px 0 5px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#1a1200;transition:.15s;letter-spacing:.3px}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.neon{background:linear-gradient(135deg,var(--pink),#8b3dff);color:#fff;box-shadow:0 0 22px #ff2bd655}
.btn.green{background:linear-gradient(135deg,var(--green),#00b86b);color:#00180d;box-shadow:0 0 22px #2dff9b44}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.card{background:linear-gradient(180deg,var(--card),#0e0b17);border:1px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:120px}
.mut{color:var(--mut)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
.hide{display:none!important}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
#auth .card{width:min(400px,100%);text-align:center;box-shadow:0 0 60px #8b3dff22}
#auth img{height:110px;filter:drop-shadow(0 0 18px #f5c54288)}
#auth .disp{font-size:30px;letter-spacing:10px;margin:6px 0 2px;color:var(--gold)}
#auth form{text-align:left}#auth .btn{width:100%;margin-top:16px}
.tabs{display:flex;gap:6px;margin:16px 0 4px;background:#0b0914;padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:700}
.tabs button.on{background:var(--card);color:var(--gold)}
.err{color:var(--red);min-height:20px;margin-top:10px;font-size:13px;text-align:center}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#side{background:#0a0812cc;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:20}
#side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
#side .brand img{height:38px}#side .brand b{font-size:19px;letter-spacing:4px;color:var(--gold)}
.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:600;border:1px solid transparent}
.nav:hover{color:var(--text);background:#ffffff08}
.nav.on{color:#fff;background:linear-gradient(90deg,#ff2bd622,#27e8ff10);border-color:#ff2bd644;box-shadow:inset 3px 0 0 var(--pink)}
.nav i{font-style:normal;font-size:19px;width:24px;text-align:center}
#side .sp{flex:1}
#top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:12px 22px;background:#07060bdd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:18px}
#wchip{display:flex;align-items:center;gap:9px;background:#0b0914;border:1px solid var(--gold);border-radius:999px;padding:7px 8px 7px 14px;cursor:pointer;box-shadow:0 0 18px #f5c54233}
#wchip b{color:var(--gold);font-size:16px}
#wchip span.plus{background:var(--gold);color:#1a1200;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:900}
#main{padding:22px;max-width:1100px;width:100%;margin:0 auto}
/* lobby */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 28px;border:1px solid #ff2bd655;background:linear-gradient(120deg,#1b0836,#0c1030 60%,#07262e);box-shadow:0 0 50px #8b3dff33}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:300px;height:300px;background:radial-gradient(circle,#f5c54255,transparent 65%)}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.05;max-width:560px;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:12px 0 20px;max-width:440px;color:#c9c2e6}
.hero img{position:absolute;right:30px;bottom:14px;height:190px;filter:drop-shadow(0 0 22px #f5c542aa);z-index:1;opacity:.95}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
.game{cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;transition:.2s}
.game:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 10px 40px #27e8ff22}
.game .em{position:absolute;right:14px;top:6px;font-size:76px;opacity:.9;filter:drop-shadow(0 0 16px #ff2bd699)}
.game h3{font-size:24px}.game.mines{background:linear-gradient(160deg,#0b2a3a,#14111f)}.game.slots{background:linear-gradient(160deg,#3a0b36,#14111f)}
.tag{display:inline-block;font-size:11px;letter-spacing:1px;background:#ffffff14;border-radius:99px;padding:3px 9px;margin-top:6px;color:var(--cyan)}
.feed div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
h2.sec{margin:26px 0 10px;font-size:20px}
/* mines */
.play{display:grid;grid-template-columns:290px 1fr;gap:18px}
#mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:480px;margin:0 auto}
.tile{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:linear-gradient(145deg,#1d1830,#110e1c);font-size:clamp(22px,5vw,36px);cursor:pointer;transition:.12s;display:grid;place-items:center}
.tile:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 18px #27e8ff44;transform:scale(1.04)}
.tile.safe{background:linear-gradient(145deg,#0b4a35,#0a2a22);border-color:var(--green);box-shadow:0 0 18px #2dff9b44;animation:pop .25s}
.tile.mine{background:linear-gradient(145deg,#5a0f26,#2a0a14);border-color:var(--red);animation:pop .25s}
.tile.dim{opacity:.45}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.big{font-family:Georgia,serif;font-size:34px;font-weight:700}
.stat{background:#0b0914;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;min-width:110px}
.stat small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase}
/* slots */
.machine{background:linear-gradient(180deg,#2a0b3a,#0e0b17);border:2px solid var(--gold);border-radius:24px;padding:22px;box-shadow:0 0 50px #f5c54244,inset 0 0 40px #ff2bd622;max-width:520px;margin:0 auto}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#05040a;padding:12px;border-radius:16px;border:1px solid var(--line)}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(34px,9vw,58px);border-radius:12px;background:#12101c;transition:.15s}
.cell.win{background:#f5c54233;box-shadow:0 0 22px var(--gold);transform:scale(1.06)}
.spinning .cell{filter:blur(2px);opacity:.8}
.winbar{text-align:center;min-height:34px;margin-top:14px;font-family:Georgia,serif;font-size:22px}
/* misc */
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #ffffff0d}th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis .stat b{font-size:22px;font-family:Georgia,serif}
.box{word-break:break-all;background:#0b0914;border:1px dashed var(--gold);border-radius:10px;padding:10px;margin:6px 0;font-family:monospace;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1730;border:1px solid var(--cyan);padding:11px 18px;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1}#toast.bad{border-color:var(--red)}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 #side{position:fixed;left:0;top:0;width:250px;transform:translateX(-105%);transition:.25s;box-shadow:10px 0 40px #000}
 #side.open{transform:none}#burger{display:block}
 .play{grid-template-columns:1fr}.hero img{height:110px;right:10px;opacity:.35}#main{padding:14px}
}
</style></head><body>
<div id="auth" class="hide"><div class="card">
 <img src="/logo.png" alt=""><div class="disp">SOLSTICE</div><div class="mut" style="font-size:13px;letter-spacing:3px">CASINO</div>
 <div class="tabs" id="atabs"><button class="on" data-m="login">Sign in</button><button data-m="register">Create account</button></div>
 <form id="af" autocomplete="on">
  <div id="a1"><label>Email</label><input id="em" type="email" autocomplete="email" required>
   <label>Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <div id="a2" class="hide"><p class="mut" style="margin-top:14px">We emailed you a 6-digit code.</p><label>Code</label><input id="cd" inputmode="numeric" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:10px"></div>
  <button class="btn neon" id="abtn">Sign in</button><div class="err" id="aerr"></div>
 </form><p class="mut" style="font-size:11px;margin-top:8px">18+ only. Play responsibly.</p>
</div></div>

<div id="app" class="hide">
 <aside id="side"><div class="brand"><img src="/logo.png" alt=""><b>SOLSTICE</b></div>
  <div class="nav on" data-v="lobby"><i>🏠</i>Lobby</div>
  <div class="nav" data-v="mines"><i>💣</i>Mines</div>
  <div class="nav" data-v="slots"><i>🎰</i>Slots</div>
  <div class="nav" data-v="wallet"><i>👛</i>Wallet</div>
  <div class="nav" data-v="history"><i>🧾</i>My bets</div>
  <div class="nav hide" data-v="admin"><i>🛡️</i>Admin</div>
  <div class="sp"></div><div class="mut" id="who" style="font-size:12px;padding:0 10px;word-break:break-all"></div>
  <div class="nav" id="logout"><i>🚪</i>Sign out</div></aside>
 <div><div id="top"><button id="burger">☰</button><div class="grow"></div>
  <div id="wchip" title="Wallet"><span>👛</span><b id="bal">$0.00</b><span class="plus">+</span></div></div>
  <div id="main"></div></div>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let me=null,view='lobby',busy=false,poll=null;
async function api(p,b){const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;throw e}return j}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2600)}
const guard=fn=>async(...a)=>{if(busy)return;busy=true;try{await fn(...a)}catch(e){toast(e.message,1);if(e.status===401)boot()}finally{busy=false}};
function setBal(n){me.balance=n;$('#bal').textContent=money(n)}
async function refreshMe(){const m=await api('me');me=m;setBal(m.balance)}

/* ---------- auth ---------- */
let amode='login',pending=null;
$$('#atabs button').forEach(b=>b.onclick=()=>{amode=b.dataset.m;pending=null;$$('#atabs button').forEach(x=>x.classList.toggle('on',x===b));
 $('#a1').classList.remove('hide');$('#a2').classList.add('hide');$('#abtn').textContent=amode==='login'?'Sign in':'Create account';$('#aerr').textContent='';
 $('#pw').autocomplete=amode==='login'?'current-password':'new-password'});
$('#af').onsubmit=async e=>{e.preventDefault();const btn=$('#abtn');btn.disabled=true;$('#aerr').textContent='';
 try{const email=$('#em').value,password=$('#pw').value;
  if(pending){await api('verify',{email:pending,code:$('#cd').value});return boot()}
  if(amode==='login'){await api('login',{email,password});return boot()}
  await api('register',{email,password});pending=email;$('#a1').classList.add('hide');$('#a2').classList.remove('hide');$('#abtn').textContent='Verify & enter'
 }catch(x){$('#aerr').textContent=x.message}finally{btn.disabled=false}};
async function boot(){try{await refreshMe();$('#auth').classList.add('hide');$('#app').classList.remove('hide');
  $('#who').textContent=me.email;$('[data-v=admin]').classList.toggle('hide',!me.admin);go(view)}
 catch(e){$('#app').classList.add('hide');$('#auth').classList.remove('hide')}}
$('#logout').onclick=async()=>{await api('logout',{});me=null;boot()};

/* ---------- shell ---------- */
$$('.nav[data-v]').forEach(n=>n.onclick=()=>go(n.dataset.v));
$('#wchip').onclick=()=>go('wallet');$('#burger').onclick=()=>$('#side').classList.toggle('open');
function go(v){view=v;clearInterval(poll);$('#side').classList.remove('open');$$('.nav[data-v]').forEach(n=>n.classList.toggle('on',n.dataset.v===v));
 ({lobby:lobby,mines:mines,slots:slots,wallet:wallet,history:history_,admin:admin})[v]();scrollTo(0,0)}

/* ---------- lobby ---------- */
async function lobby(){
 $('#main').innerHTML=`<div class="hero"><img src="/logo.png" alt=""><h1>Where the house glows gold.</h1><p>Provably simple odds, instant payouts to your wallet balance. Pick a game and play.</p>
 <div class="row"><button class="btn neon" onclick="go('mines')">Play Mines</button><button class="btn" onclick="go('slots')">Spin Slots</button></div></div>
 <div class="grid2"><div class="card game mines" onclick="go('mines')"><div class="em">💣</div><h3>Mines</h3><span class="mut">Pick gems, dodge bombs, cash out anytime.</span><span class="tag">UP TO 24 MINES · 3% EDGE</span></div>
 <div class="card game slots" onclick="go('slots')"><div class="em">🎰</div><h3>Slots</h3><span class="mut">3 reels, 5 paylines, jackpot 💎💎💎.</span><span class="tag">96.8% RTP</span></div></div>
 <h2 class="sec">Live bets</h2><div class="card feed" id="feed"><span class="mut">Loading…</span></div>`;
 const draw=async()=>{try{const f=await api('feed');const el=$('#feed');if(!el)return;el.innerHTML=f.length?f.map(x=>`<div><span>${esc(x.u)} · ${x.game==='mines'?'💣':'🎰'} ${esc(x.game)}</span><span class="${x.payout>x.bet?'green':'mut'}">${money(x.bet)} → ${money(x.payout)}</span></div>`).join(''):'<span class="mut">No bets yet — be the first.</span>'}catch(e){}};
 draw();poll=setInterval(draw,6000)}

/* ---------- mines ---------- */
let mg=null,mEnd=null;
async function mines(){
 $('#main').innerHTML=`<div class="play"><div class="card"><h2>Mines</h2>
  <label>Bet (USD)</label><input id="mbet" type="number" min="0.1" step="0.1" value="1">
  <div class="row" style="margin-top:6px">${[.5,2,'½','2×'].slice(2).map(x=>`<button class="btn ghost sm" data-k="${x}">${x}</button>`).join('')}</div>
  <label>Mines</label><select id="mcount">${[...Array(24)].map((_,i)=>`<option ${i==2?'selected':''}>${i+1}</option>`).join('')}</select>
  <button class="btn neon" id="mgo" style="width:100%;margin-top:16px">Start game</button>
  <button class="btn green" id="mcash" style="width:100%;margin-top:10px" disabled>Cash out</button>
  <div class="row" style="margin-top:14px"><div class="stat"><small>Multiplier</small><b id="mmult">1.00×</b></div><div class="stat"><small>Next</small><b id="mnext">—</b></div></div>
  <div class="winbar" id="mmsg" style="font-size:18px"></div></div>
  <div class="card"><div id="mgrid"></div></div></div>`;
 $$('[data-k]').forEach(b=>b.onclick=()=>{const i=$('#mbet');i.value=Math.max(.1,Math.min(1000,(b.dataset.k==='½'?i.value/2:i.value*2))).toFixed(2)});
 $('#mgo').onclick=guard(async()=>{mEnd=null;mg=await api('mines/start',{bet:$('#mbet').value,mines:$('#mcount').value});await refreshMe();mDraw()});
 $('#mcash').onclick=guard(async()=>{mg=await api('mines/cashout',{});mEnd=mg;await refreshMe();mDraw()});
 try{mg=await api('mines/state');if(mg.active){$('#mbet').value=mg.bet;$('#mcount').value=mg.mines}}catch(e){mg=null}mDraw()}
function mDraw(){const act=mg&&mg.active;const g=$('#mgrid');if(!g)return;
 g.innerHTML=[...Array(25)].map((_,i)=>{let c='tile',t='',d='';const rev=mg&&mg.revealed&&mg.revealed.includes(i),isM=mg&&mg.minePositions&&mg.minePositions.includes(i);
  if(rev){c+=' safe';t='💎'}else if(isM){c+=' mine'+(mEnd&&mEnd.tile===i?'':' dim');t='💣'}
  if(!act)d='disabled';return `<button class="${c}" data-t="${i}" ${d}>${t}</button>`}).join('');
 $$('#mgrid .tile').forEach(b=>b.onclick=guard(async()=>{const r=await api('mines/reveal',{tile:+b.dataset.t});mg=r;if(!r.active){mEnd=r;await refreshMe()}mDraw()}));
 $('#mgo').disabled=act;$('#mcash').disabled=!(act&&mg.safe>0);$('#mbet').disabled=$('#mcount').disabled=act;
 $('#mmult').textContent=(mg&&mg.mult?mg.mult:1).toFixed(2)+'×';$('#mnext').textContent=act?mg.next.toFixed(2)+'×':'—';
 const m=$('#mmsg');if(act){m.className='winbar';m.textContent=mg.safe?`Cash out: ${money(mg.bet*mg.mult)}`:'Pick a tile'}
 else if(mEnd){m.className='winbar '+(mEnd.boom?'red':'green');m.textContent=mEnd.boom?'💥 Boom! You hit a mine':`Won ${money(mEnd.payout)}`}else m.textContent=''}

/* ---------- slots ---------- */
const SYM=['💎','7️⃣','🔔','🍇','🍋','🍒'],LINES=[[0,0,0],[1,1,1],[2,2,2],[0,1,2],[2,1,0]];
function slots(){
 $('#main').innerHTML=`<div class="machine"><h2 class="disp gold" style="text-align:center;margin-bottom:12px">✦ SOLSTICE SLOTS ✦</h2>
  <div class="reels" id="reels">${[...Array(9)].map(()=>'<div class="cell">🎰</div>').join('')}</div>
  <div class="winbar" id="swin"></div>
  <div class="row" style="margin-top:8px"><div class="grow"><label>Bet per spin</label><input id="sbet" type="number" min="0.1" step="0.1" value="1"></div>
  <button class="btn neon" id="sgo" style="flex:1;min-width:140px;align-self:flex-end;padding:15px;font-size:17px">SPIN</button></div>
  <p class="mut" style="font-size:12px;margin-top:12px;text-align:center">5 paylines · 3 in a row: 🍒10× 🍋17× 🍇26× 🔔47× 7️⃣135× 💎360× (of line bet = bet ÷ 5)</p></div>`;
 const cells=()=>$$('#reels .cell');
 $('#sgo').onclick=guard(async()=>{const go=$('#sgo');go.disabled=true;$('#swin').textContent='';cells().forEach(c=>c.classList.remove('win'));
  const R=$('#reels');R.classList.add('spinning');const tick=setInterval(()=>cells().forEach(c=>c.textContent=SYM[Math.random()*6|0]),70);
  try{const [r]=await Promise.all([api('slots/spin',{bet:$('#sbet').value}),sleep(900)]);clearInterval(tick);R.classList.remove('spinning');
   cells().forEach((c,i)=>c.textContent=r.grid[i%3][(i/3)|0]);
   r.wins.forEach(w=>LINES[w.line].forEach((row,reel)=>cells()[row*3+reel].classList.add('win')));
   const sw=$('#swin');sw.className='winbar '+(r.payout>0?'green':'mut');sw.textContent=r.payout>0?`WIN ${money(r.payout)}!`:'No win — spin again';await refreshMe()
  }catch(e){clearInterval(tick);R.classList.remove('spinning');throw e}finally{go.disabled=false}})}

/* ---------- wallet ---------- */
async function wallet(){
 const coins=await api('coins').catch(()=>[]);
 $('#main').innerHTML=`<h2>Wallet</h2><div class="card" style="margin:12px 0"><div class="mut">Balance</div><div class="big gold">${money(me.balance)}</div></div>
 <div class="grid2"><div class="card"><h3>Deposit</h3><label>Coin</label><select id="dc">${coins.filter(c=>c.deposit).map(c=>`<option value="${c.code}">${esc(c.label)}</option>`).join('')||'<option value="">No coins available</option>'}</select>
  <label>Amount (USD, $10+)</label><input id="da" type="number" min="10" value="25"><button class="btn" id="dgo" style="width:100%;margin-top:14px">Get deposit address</button><div id="dbox"></div></div>
 <div class="card"><h3>Withdraw</h3><label>Coin</label><select id="wc">${coins.map(c=>`<option value="${c.code}">${esc(c.label)} · fee $${c.fee}</option>`).join('')}</select>
  <label>Amount (USD, $10+)</label><input id="wa" type="number" min="10" value="20"><label>Your address</label><input id="wad" placeholder="Paste address">
  <button class="btn ghost" id="wgo" style="width:100%;margin-top:14px">Request withdrawal</button></div></div>
 <h2 class="sec">Deposits</h2><div class="card" id="dl"></div><h2 class="sec">Withdrawals</h2><div class="card" id="wl"></div>`;
 $('#dgo').onclick=guard(async()=>{const d=await api('deposit',{coin:$('#dc').value,amount:$('#da').value});showDep(d);lists()});
 $('#wgo').onclick=guard(async()=>{await api('withdraw',{coin:$('#wc').value,amount:$('#wa').value,address:$('#wad').value});toast('Withdrawal requested');await refreshMe();wallet()});
 lists();poll=setInterval(lists,15000)}
function showDep(d){$('#dbox').innerHTML=`<p class="mut" style="margin-top:12px">Send <b>exactly</b> this amount (it identifies your deposit):</p><div class="box gold">${esc(d.payAmount)} ${esc(d.payCurrency)}</div>
 <p class="mut">To address:</p><div class="box">${esc(d.address)}</div><label>After sending, paste the transaction ID</label><input id="dtx"><button class="btn green" id="dtb" style="width:100%;margin-top:10px">Submit transaction</button>`;
 $('#dtb').onclick=guard(async()=>{await api('deposit/tx',{id:d.id,txid:$('#dtx').value});toast('Transaction submitted');$('#dbox').innerHTML='';lists()})}
async function lists(){try{const [d,w]=await Promise.all([api('deposits'),api('withdrawals')]);const dl=$('#dl'),wl=$('#wl');if(!dl)return;
 dl.innerHTML=d.length?`<table><tr><th>When</th><th>Coin</th><th>USD</th><th>Status</th></tr>${d.map(x=>`<tr><td>${new Date(x.ts).toLocaleString()}</td><td>${esc(x.payCurrency)}</td><td>${money(x.usd)}</td><td>${esc(x.status)}${x.status==='confirming'?` (${x.confirmations||0})`:''}</td></tr>`).join('')}</table>`:'<span class="mut">No deposits yet.</span>';
 wl.innerHTML=w.length?`<table><tr><th>When</th><th>Coin</th><th>USD</th><th>Status</th></tr>${w.map(x=>`<tr><td>${new Date(x.ts).toLocaleString()}</td><td>${esc(x.sym)}</td><td>${money(x.usd)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table>`:'<span class="mut">No withdrawals yet.</span>';
 if(d.some(x=>x.status==='finished'))refreshMe()}catch(e){}}

/* ---------- history ---------- */
async function history_(){const h=await api('history');
 $('#main').innerHTML=`<h2>My bets</h2><div class="card" style="margin-top:12px">${h.length?`<table><tr><th>When</th><th>Game</th><th>Bet</th><th>Payout</th></tr>${h.map(x=>`<tr><td>${new Date(x.t).toLocaleString()}</td><td>${esc(x.game)}</td><td>${money(x.bet)}</td><td class="${x.payout>x.bet?'green':'mut'}">${money(x.payout)}</td></tr>`).join('')}</table>`:'<span class="mut">No bets yet.</span>'}</div>`}

/* ---------- admin ---------- */
async function admin(){
 if(!me.admin)return go('lobby');
 const [s,u,w,l]=await Promise.all([api('admin/stats'),api('admin/users'),api('admin/withdrawals'),api('admin/log')]);
 $('#main').innerHTML=`<h2>🛡️ Admin</h2><div class="kpis" style="margin:12px 0"><div class="stat"><small>Users</small><b>${s.users}</b></div><div class="stat"><small>Bets</small><b>${s.bets}</b></div><div class="stat"><small>Wagered</small><b>${money(s.wagered)}</b></div><div class="stat"><small>Paid out</small><b>${money(s.paid)}</b></div><div class="stat"><small>House profit</small><b class="${s.profit>=0?'green':'red'}">${money(s.profit)}</b></div></div>
 <h2 class="sec">Pending withdrawals (${w.length})</h2><div class="card">${w.length?w.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #ffffff0d"><b>${x.amount} ${esc(x.sym)}</b> <span class="mut">(${money(x.usd)}) · ${esc(x.email)}</span><div class="box">${esc(x.address)}</div>
  <div class="row"><input class="grow" placeholder="Transaction ID (optional)" id="tx${x.id}"><button class="btn green sm" data-s="${x.id}">Mark sent</button><button class="btn ghost sm" data-r="${x.id}">Reject + refund</button></div></div>`).join(''):'<span class="mut">Nothing pending.</span>'}</div>
 <h2 class="sec">Adjust a balance</h2><div class="card row"><input class="grow" id="ae" placeholder="user email"><input style="width:130px" id="aa" type="number" step="0.01" placeholder="± USD"><input class="grow" id="an" placeholder="note"><button class="btn sm" id="ago">Apply</button></div>
 <h2 class="sec">Users</h2><div class="card" style="overflow:auto"><table><tr><th>Email</th><th>Balance</th></tr>${u.map(x=>`<tr><td>${esc(x.email)}</td><td>${money(x.balance)}</td></tr>`).join('')}</table></div>
 <h2 class="sec">Admin log</h2><div class="card">${l.length?l.map(x=>`<div class="mut" style="font-size:12px">${new Date(x.t).toLocaleString()} · ${esc(x.by)} → ${esc(x.email)} ${x.amount>0?'+':''}${x.amount} ${esc(x.note)}</div>`).join(''):'<span class="mut">Empty.</span>'}</div>`;
 $$('[data-s]').forEach(b=>b.onclick=guard(async()=>{await api('admin/withdrawals/sent',{id:b.dataset.s,txid:$('#tx'+b.dataset.s).value});toast('Marked sent');admin()}));
 $$('[data-r]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Reject and refund?'))return;await api('admin/withdrawals/reject',{id:b.dataset.r});toast('Rejected');admin()}));
 $('#ago').onclick=guard(async()=>{await api('admin/adjust',{email:$('#ae').value,amount:$('#aa').value,note:$('#an').value});toast('Balance updated');admin()})}

boot();
</script></body></html>
