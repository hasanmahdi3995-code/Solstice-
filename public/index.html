--ease:cubic-bezier(.2,.8,.2,1);--disp:'Fraunces',Georgia,serif;--ui:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:14.5px/1.5 var(--ui);min-height:100%}
body{overflow-x:hidden}
#bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
#bgfx i:nth-child(1){width:520px;height:520px;background:#5b1fd1;left:-8%;top:-12%}
#bgfx i:nth-child(2){width:460px;height:460px;background:#d1169f;right:-10%;top:12%;animation-delay:-7s;opacity:.32}
#bgfx i:nth-child(3){width:520px;height:520px;background:#0aa6c9;left:30%;bottom:-25%;animation-delay:-13s;opacity:.25}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:900;letter-spacing:.2px}
button,input,select{font:inherit;color:inherit}
input,select{background:#0a0816;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #2ee6ff22}
input:disabled,select:disabled{opacity:.5}
label{display:block;color:var(--mut);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;margin:14px 0 6px;font-weight:600}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:13px 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9a2e);color:#1a1100;transition:transform .15s var(--ease),filter .2s,box-shadow .2s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.neon{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 28px #ff3fd844}
.btn.green{background:linear-gradient(135deg,var(--green),#00b86b);color:#00180d;box-shadow:0 8px 28px #33ffa633}
.btn.ghost{background:#ffffff08;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.shine:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.card{background:linear-gradient(180deg,#ffffff07,#ffffff02),var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(8px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:110px}
.mut{color:var(--mut)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.hide{display:none!important}
.view{animation:viewin .45s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(16px)}}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
#auth .card{width:min(420px,100%);text-align:center;box-shadow:0 0 80px #8b5cff30;animation:viewin .6s var(--ease)}
.sun{width:92px;height:92px;margin:0 auto;display:block;animation:spinslow 24s linear infinite;filter:drop-shadow(0 0 20px #ffc84a88)}
@keyframes spinslow{to{transform:rotate(360deg)}}
#auth .disp{font-size:32px;letter-spacing:11px;margin:8px 0 0;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#auth form{text-align:left}#auth .btn{width:100%;margin-top:18px}
.tabs{display:flex;gap:6px;margin:18px 0 4px;background:#08060f;padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;cursor:pointer;color:var(--mut);font-weight:700;transition:.25s}
.tabs button.on{background:var(--card2);color:var(--gold);box-shadow:0 2px 12px #0006}
.err{color:var(--red);min-height:20px;margin-top:10px;font-size:13px;text-align:center}
/* shell */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
#side{background:#07050dd9;backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{width:36px;height:36px;animation:spinslow 24s linear infinite}.brand b{font-family:var(--disp);font-size:20px;letter-spacing:5px;color:var(--gold)}
.navh{font-size:10px;letter-spacing:2px;color:#5f5780;padding:14px 12px 4px;font-weight:700}
.nav{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:600;transition:.2s var(--ease)}
.nav:hover{color:var(--text);background:#ffffff0a;transform:translateX(3px)}
.nav.on{color:#fff;background:linear-gradient(90deg,#ff3fd824,#2ee6ff10)}

		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

  <div><div class="row" style="margin-bottom:14px">${coinIco(d.code)}<div><b>Deposit ${esc(d.payCurrency)}</b><div class="mut" style="font-size:12px">Crediting ${money(d.usd)} to your balance</div></div></div>
  <div class="fld"><small>1 · Send exactly</small>${copyRow('pamt',d.payAmount,d.payAmount+' '+d.payCurrency,'amt')}</div>
  <div class="fld"><small>2 · To this address</small>${copyRow('padr',d.address,d.address)}</div>
  <div class="info warn">${ic('warn')}<span>Send the <b>exact amount</b> shown, on the ${esc(d.payCurrency)} network only. A different amount can't be matched to your account.</span></div>
  <div class="fld" style="margin-top:16px"><small>3 · Paste your transaction ID</small><input id="dtx" placeholder="Transaction hash (64 characters)" autocomplete="off"></div>
  <div class="row"><button class="btn green" id="dtb" style="flex:1;padding:14px">${'I\'ve sent it · Verify'}</button><button class="btn ghost" id="dnew">Start over</button></div></div></div></div>`}
 if(W.step===4&&d){const need=(W.coins.find(x=>x.code===d.code)||{}).conf||'?',cf=d.confirmations||0,pct=d.status==='finished'?100:Math.min(95,need>0?cf/need*100:10),fin=d.status==='finished',bad=d.status==='failed'||d.status==='expired';
  return `<div class="card">${stepper()}${fin?`<div class="okmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div><h2 style="text-align:center">${money(d.usd)} credited</h2><p class="mut" style="text-align:center;margin-top:4px">Your balance is updated. Good luck!</p>`:bad?`<div class="info warn">${ic('warn')}<span>${d.status==='failed'?'That transaction did not pay the exact amount to the deposit address.':'This deposit expired before a payment arrived.'} Start a new deposit to try again.</span></div>`:
  `<h3>Waiting for confirmations</h3><p class="mut" style="font-size:13px">This usually takes a few minutes. You can leave this page — we'll credit you automatically.</p>`}
  <div class="ttrack" style="margin-top:18px">
   <div class="tl done"><div class="dot">${ic('check')}</div><div><b>Address generated</b><small>${esc(d.payAmount)} ${esc(d.payCurrency)} requested</small></div></div>
   <div class="tl ${d.txid?'done':'now'}"><div class="dot">${ic(d.txid?'check':'clock')}</div><div><b>Transaction detected</b><small>${d.txid?esc(short(d.txid,10)):'Waiting for your payment'}</small></div></div>
   <div class="tl ${fin?'done':d.txid&&!bad?'now':''}"><div class="dot">${ic(fin?'check':'bolt')}</div><div style="flex:1"><b>Network confirmations</b><small>${cf} of ${need} confirmations</small>${bad?'':`<div class="pbar"><i style="width:${pct}%"></i></div>`}</div></div>
   <div class="tl ${fin?'done':''}"><div class="dot">${ic(fin?'check':'wallet')}</div><div><b>Credited to balance</b><small>${money(d.usd)}</small></div></div></div>
  <div class="row" style="margin-top:20px">${fin?'<button class="btn neon shine" id="dplay" style="flex:1">Start playing</button>':''}<button class="btn ghost" id="dnew" style="flex:1">New deposit</button></div></div>`}
 W.step=1;return depHTML()}
function renderQR(uri,code){const box=$('#qr');if(!box)return;
 try{box.innerHTML=QRLite.svg(uri)+`<div class="qrlogo">${coinIco(code)}</div>`}catch(e){box.innerHTML='<div style="color:#444;font-size:12px;text-align:center;padding:10px">Use the address below</div>'}}
function depWire(){
 $$('.coinc').forEach(b=>b.onclick=()=>{W.coin=b.dataset.c;W.step=2;renderW()});
 if($('#dback'))$('#dback').onclick=()=>{W.step=1;renderW()};
 if($('#damt')){const c=W.coins.find(x=>x.code===W.coin),p=W.px[c.sym],upd=()=>{W.amt=+$('#damt').value||0;$('#dest').textContent=p&&W.amt?'≈ '+(W.amt/p.price).toFixed(c.sym==='ETH'?5:6)+' '+c.sym:'—';$$('.qchip').forEach(q=>q.classList.toggle('on',+q.dataset.a===W.amt))};
  $('#damt').oninput=upd;$$('.qchip').forEach(q=>q.onclick=()=>{$('#damt').value=q.dataset.a;upd()});upd();
  $('#dgo').onclick=guard(async()=>{const d=await api('deposit',{coin:W.coin,amount:$('#damt').value});W.dep=d;W.step=3;renderW();refreshDeps()})}
 if(W.step===3&&W.dep){const d=W.dep,k=CC[d.code]||{};renderQR(`${k.uri||d.code}:${d.address}?amount=${d.payAmount}`,d.code);tick();
  $('#dtb').onclick=guard(async()=>{const r=await api('deposit/tx',{id:d.id,txid:$('#dtx').value});W.dep=r;W.step=4;toast('Transaction found — confirming');renderW()})}
 if($('#dnew'))$('#dnew').onclick=()=>{W.dep=null;W.step=1;W.coin=null;renderW()};
 if($('#dplay'))$('#dplay').onclick=()=>go('lobby')}
/* ----- withdraw ----- */
function wdHTML(){const c=W.coins.find(x=>x.code===W.wcoin)||{};
 return `<div class="card"><h3 style="margin-bottom:14px">Withdraw crypto</h3><div class="coins" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${W.coins.map((x,i)=>`<button class="coinc ${W.wcoin===x.code?'sel':''}" data-w="${x.code}" style="--i:${i}">${coinIco(x.code,36)}<div><b>${x.sym}</b><small>fee ${money(x.fee)}</small></div></button>`).join('')}</div>
 <label>Amount (USD)</label><input id="wa" type="number" min="10" value="${W.wamt||20}"><div class="chipsrow"><button class="qchip" data-m="max">Max</button></div>
 <label>Your ${esc(c.sym||'')} address</label><input id="wad" placeholder="Paste your wallet address" autocomplete="off">
 <div class="est" style="flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between"><span>Network fee</span><b>${money(c.fee||0)}</b></div><div style="display:flex;justify-content:space-between"><span>You receive about</span><b id="wrec">—</b></div></div>
 <div class="info">${ic('info')}<span>Withdrawals are reviewed and sent manually, usually within a few hours.</span></div>
 <button class="btn" id="wgo" style="width:100%;margin-top:16px;padding:15px">Request withdrawal</button></div>`}
function wdWire(){const c=W.coins.find(x=>x.code===W.wcoin)||{},p=W.px[c.sym];
 $$('[data-w]').forEach(b=>b.onclick=()=>{W.wamt=$('#wa').value;W.wcoin=b.dataset.w;renderW()});
 const upd=()=>{const a=+$('#wa').value||0;$('#wrec').textContent=p&&a>c.fee?'≈ '+((a-c.fee)/p.price).toFixed(6)+' '+c.sym:'—'};
 $('#wa').oninput=upd;upd();$('[data-m=max]').onclick=()=>{$('#wa').value=Math.floor(me.balance*100)/100;upd()};
 $('#wgo').onclick=guard(async()=>{await api('withdraw',{coin:W.wcoin,amount:$('#wa').value,address:$('#wad').value});toast('Withdrawal requested');await refreshMe();await refreshDeps();W.tab='history';$$('#wtabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='history'));renderW()})}
/* ----- history ----- */
function histHTML(){const D=W.deps,Wd=W.wds;
 return `<div class="card"><h3 style="margin-bottom:6px">Deposits</h3>${D.length?D.map((x,i)=>`<div class="hrow ${x.status==='waiting'||x.status==='confirming'?'click':''}" data-d="${x.id}" style="--i:${i}">${coinIco(x.code)}<div class="m"><b>${esc(x.payCurrency)} deposit</b><small>${ago(x.ts)}${x.txid?' · '+esc(short(x.txid,6)):''}</small></div><div class="r"><b class="${x.status==='finished'?'green':''}">+${money(x.usd)}</b>${stB(x.status)}</div></div>`).join(''):'<div class="empty">No deposits yet.</div>'}</div>
 <div class="card" style="margin-top:14px"><h3 style="margin-bottom:6px">Withdrawals</h3>${Wd.length?Wd.map((x,i)=>`<div class="hrow" style="--i:${i}">${coinIco(x.code||x.sym)}<div class="m"><b>${esc(x.sym)} withdrawal</b><small>${ago(x.ts)} · ${esc(short(x.address,6))}</small></div><div class="r"><b>-${money(x.usd)}</b>${stB(x.status)}</div></div>`).join(''):'<div class="empty">No withdrawals yet.</div>'}</div>`}
function histWire(){$$('[data-d]').forEach(r=>r.onclick=()=>{const d=W.deps.find(x=>x.id===r.dataset.d);if(!d||!(d.status==='waiting'||d.status==='confirming'))return;W.dep=d;W.coin=d.code;W.step=d.status==='waiting'?3:4;W.tab='deposit';$$('#wtabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='deposit'));renderW()})}

/* ---------- history ---------- */
VIEWS.history=async function(){const h=await api('history');
 $('#main').innerHTML=`<h2>My bets</h2><div class="card" style="margin-top:12px">${h.length?`<table><tr><th>When</th><th>Game</th><th>Bet</th><th>Payout</th></tr>${h.map((x,i)=>`<tr style="--i:${i}"><td>${new Date(x.t).toLocaleString()}</td><td>${ICON[x.game]||''} ${esc(x.game)}</td><td>${money(x.bet)}</td><td class="${x.payout>x.bet?'green':'mut'}">${money(x.payout)}</td></tr>`).join('')}</table>`:'<span class="mut">No bets yet.</span>'}</div>`};

/* ---------- admin ---------- */
VIEWS.admin=async function(){
 if(!me.admin)return go('lobby');
 const [s,u,w,l]=await Promise.all([api('admin/stats'),api('admin/users'),api('admin/withdrawals'),api('admin/log')]);
 $('#main').innerHTML=`<h2>🛡️ Admin</h2><div class="kpis" style="margin:12px 0"><div class="stat"><small>Users</small><b>${s.users}</b></div><div class="stat"><small>Bets</small><b>${s.bets}</b></div><div class="stat"><small>Wagered</small><b>${money(s.wagered)}</b></div><div class="stat"><small>Paid out</small><b>${money(s.paid)}</b></div><div class="stat"><small>House profit</small><b class="${s.profit>=0?'green':'red'}">${money(s.profit)}</b></div></div>
 <h2 class="sec">Pending withdrawals (${w.length})</h2><div class="card">${w.length?w.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #ffffff0d"><b>${x.amount} ${esc(x.sym)}</b> <span class="mut">(${money(x.usd)}) · ${esc(x.email)}</span><div class="box">${esc(x.address)}</div>
  <div class="row"><input class="grow" placeholder="Transaction ID (optional)" id="tx${x.id}"><button class="btn green sm" data-s="${x.id}">Mark sent</button><button class="btn ghost sm" data-r="${x.id}">Reject + refund</button></div></div>`).join(''):'<span class="mut">Nothing pending.</span>'}</div>
 <h2 class="sec">Adjust a balance</h2><div class="card row"><input class="grow" id="ae" placeholder="user email"><input style="width:130px" id="aa" type="number" step="0.01" placeholder="± USD"><input class="grow" id="an" placeholder="note"><button class="btn sm" id="ago">Apply</button></div>
 <h2 class="sec">Users</h2><div class="card" style="overflow:auto"><table><tr><th>Email</th><th>Balance</th></tr>${u.map(x=>`<tr><td>${esc(x.email)}</td><td>${money(x.balance)}</td></tr>`).join('')}</table></div>
 <h2 class="sec">Admin log</h2><div class="card">${l.length?l.map(x=>`<div class="mut" style="font-size:12px">${new Date(x.t).toLocaleString()} · ${esc(x.by)} → ${esc(x.email)} ${x.amount>0?'+':''}${x.amount} ${esc(x.note)}</div>`).join(''):'<span class="mut">Empty.</span>'}</div>`;
 $$('[data-s]').forEach(b=>b.onclick=guard(async()=>{await api('admin/withdrawals/sent',{id:b.dataset.s,txid:$('#tx'+b.dataset.s).value});toast('Marked sent');VIEWS.admin()}));
 $$('[data-r]').forEach(b=>b.onclick=guard(async()=>{if(!confirm('Reject and refund?'))return;await api('admin/withdrawals/reject',{id:b.dataset.r});toast('Rejected');VIEWS.admin()}));
 $('#ago').onclick=guard(async()=>{await api('admin/adjust',{email:$('#ae').value,amount:$('#aa').value,note:$('#an').value});toast('Balance updated');VIEWS.admin()})};
hydrate();
const T0=performance.now();
boot().finally(()=>setTimeout(()=>{const s=$('#splash');if(s)s.classList.add('out')},Math.max(0,1200-(performance.now()-T0))));
</script></body></html>
