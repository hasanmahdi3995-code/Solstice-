<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06050c">
<title>Solstice Casino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23f5c542'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06050c;--card:#110e1d;--card2:#171229;--line:#2a2244;--text:#f1edff;--mut:#9188b3;--gold:#ffc84a;--pink:#ff3fd8;--violet:#8b5cff;--cyan:#2ee6ff;--green:#33ffa6;--red:#ff4d6d;
--ease:cubic-bezier(.2,.8,.2,1);--disp:'Fraunces',Georgia,serif;--ui:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:14.5px/1.5 var(--ui);min-height:100%}
body{overflow-x:hidden}
#bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
#bgfx i:nth-child(1){width:520px;height:520px;background:#5b1fd1;left:-8%;top:-12%}
#bgfx i:nth-child(2){width:460px;height:460px;background:#d1169f;right:-10%;top:12%;animation-delay:-7s;opacity:.32}
#bgfx i:nth-child(3){width:520px;height:520px;background:#0aa6c9;left:30%;bottom:-25%;animation-delay:-13s;opacity:.25}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:900;letter-spacing:.2px}
button,input,select{font:inherit;color:inherit}
input,select{background:#0a0816;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #2ee6ff22}
input:disabled,select:disabled{opacity:.5}
label{display:block;color:var(--mut);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;margin:14px 0 6px;font-weight:600}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;padding:13px 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9a2e);color:#1a1100;transition:transform .15s var(--ease),filter .2s,box-shadow .2s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-2px)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.neon{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 28px #ff3fd844}
.btn.green{background:linear-gradient(135deg,var(--green),#00b86b);color:#00180d;box-shadow:0 8px 28px #33ffa633}
.btn.ghost{background:#ffffff08;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.shine:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.card{background:linear-gradient(180deg,#ffffff07,#ffffff02),var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(8px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:110px}
.mut{color:var(--mut)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.hide{display:none!important}
.view{animation:viewin .45s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(16px)}}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
#auth .card{width:min(420px,100%);text-align:center;box-shadow:0 0 80px #8b5cff30;animation:viewin .6s var(--ease)}
.sun{width:92px;height:92px;margin:0 auto;display:block;animation:spinslow 24s linear infinite;filter:drop-shadow(0 0 20px #ffc84a88)}
@keyframes spinslow{to{transform:rotate(360deg)}}
#auth .disp{font-size:32px;letter-spacing:11px;margin:8px 0 0;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#auth form{text-align:left}#auth .btn{width:100%;margin-top:18px}
.tabs{display:flex;gap:6px;margin:18px 0 4px;background:#08060f;padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;cursor:pointer;color:var(--mut);font-weight:700;transition:.25s}
.tabs button.on{background:var(--card2);color:var(--gold);box-shadow:0 2px 12px #0006}
.err{color:var(--red);min-height:20px;margin-top:10px;font-size:13px;text-align:center}
/* shell */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
#side{background:#07050dd9;backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{width:36px;height:36px;animation:spinslow 24s linear infinite}.brand b{font-family:var(--disp);font-size:20px;letter-spacing:5px;color:var(--gold)}
.navh{font-size:10px;letter-spacing:2px;color:#5f5780;padding:14px 12px 4px;font-weight:700}
.nav{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:600;transition:.2s var(--ease)}
.nav:hover{color:var(--text);background:#ffffff0a;transform:translateX(3px)}
.nav.on{color:#fff;background:linear-gradient(90deg,#ff3fd824,#2ee6ff10)}
.nav.on:before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--pink);box-shadow:0 0 12px var(--pink)}
.nav i{font-style:normal;font-size:18px;width:24px;text-align:center}
#side .sp{flex:1}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:#06050ccc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:12px;padding:7px 12px;cursor:pointer;font-size:18px}
#wchip{display:flex;align-items:center;gap:10px;background:#0a0816;border:1px solid #ffc84a66;border-radius:999px;padding:6px 6px 6px 16px;cursor:pointer;transition:.2s;box-shadow:0 0 22px #ffc84a22}
#wchip:hover{box-shadow:0 0 28px #ffc84a55;transform:translateY(-1px)}
#wchip b{color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums}
#wchip .plus{background:var(--gold);color:#1a1100;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:900}
#wchip.pulse{animation:pulse .6s}@keyframes pulse{40%{transform:scale(1.08);box-shadow:0 0 40px #33ffa688}}
#wchip.pulse.loss{animation:shake .4s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#main{padding:24px;max-width:1120px;width:100%;margin:0 auto}
/* lobby */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:42px 34px;border:1px solid #ff3fd855;background:linear-gradient(120deg,#210a45,#0d1236 60%,#06303a);box-shadow:0 0 70px #8b5cff33}
.hero .orb{position:absolute;right:-70px;top:-70px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#ffc84a99,#ff3fd833 55%,transparent 70%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.8}}
.hero h1{position:relative;font-size:clamp(32px,6vw,56px);line-height:1.02;max-width:600px;background:linear-gradient(90deg,#fff,var(--gold),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:200% 0}}
.hero p{position:relative;margin:14px 0 22px;max-width:460px;color:#cfc8ee}
.hero .row{position:relative}
.chips{display:flex;gap:8px;margin:24px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#ffffff06;border-radius:99px;padding:7px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);transition:.2s}
.chip.on,.chip:hover{color:#fff;border-color:var(--pink);background:#ff3fd81c}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:14px}
.game{--c1:#3a0b36;--c2:#14111f;cursor:pointer;aspect-ratio:4/4.6;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;padding:18px;background:linear-gradient(165deg,var(--c1),var(--c2) 80%);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;animation:viewin .5s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.game:hover{transform:translateY(-8px) rotate(-.6deg);border-color:var(--cyan);box-shadow:0 18px 50px #2ee6ff2a}
.game .em{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:78px;filter:drop-shadow(0 0 22px var(--c1));animation:float 4s ease-in-out infinite;animation-delay:calc(var(--i)*-.6s);transition:.4s var(--ease)}
.game:hover .em{transform:translate(-50%,-56%) scale(1.22) rotate(8deg)}
@keyframes float{50%{margin-top:-10px}}
.game h3{font-size:24px;position:relative}.game small{color:#d3cbf0cc;position:relative}
.tag{position:relative;align-self:flex-start;font-size:10px;letter-spacing:1.2px;background:#ffffff18;border-radius:99px;padding:3px 10px;margin-top:8px;color:var(--cyan);font-weight:700}
.tag.new{background:var(--pink);color:#fff}
h2.sec{margin:30px 0 12px;font-size:22px}
.feed div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff0c;font-size:13px;animation:slidein .5s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
@keyframes slidein{from{opacity:0;transform:translateX(-18px)}}
/* game layout */
.play{display:grid;grid-template-columns:310px 1fr;gap:18px}
.play h2{margin-bottom:2px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;position:relative;overflow:hidden}
.stat{background:#0a0816;border:1px solid var(--line);border-radius:14px;padding:10px 13px;flex:1;min-width:100px}
.stat small{display:block;color:var(--mut);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.stat b{font-variant-numeric:tabular-nums;font-size:17px}
.big{font-family:var(--disp);font-size:36px;font-weight:900}
.winbar{text-align:center;min-height:36px;margin-top:14px;font-family:var(--disp);font-size:24px;font-weight:900}
.winbar.green{animation:popin .5s var(--ease);text-shadow:0 0 24px #33ffa6aa}.winbar.red{animation:shake .4s}
@keyframes popin{from{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}}
.seg{display:flex;background:#08060f;padding:4px;border-radius:12px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:700;transition:.2s;font-size:13px}
.seg button.on{background:var(--card2);color:var(--gold)}
input[type=range]{padding:0;height:8px;border:0;appearance:none;background:transparent;box-shadow:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:26px;height:26px;border-radius:8px;background:var(--gold);border:3px solid #1a1100;box-shadow:0 0 18px #ffc84a99;cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:8px;background:var(--gold);border:3px solid #1a1100}
/* mines */
#mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(480px,100%);perspective:900px}
.tile{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,#231b3d,#120e20);font-size:clamp(22px,5vw,38px);cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s;display:grid;place-items:center;box-shadow:0 4px 0 #0007}
.tile:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 22px #2ee6ff55,0 4px 0 #0007;transform:translateY(-3px)}
.tile:disabled{cursor:default}
.tile.safe{background:linear-gradient(145deg,#0c5a40,#0a2c24);border-color:var(--green);box-shadow:0 0 22px #33ffa655;animation:flip .5s var(--ease)}
.tile.mine{background:linear-gradient(145deg,#6a1030,#2a0a14);border-color:var(--red);animation:flip .5s var(--ease) both;animation-delay:var(--d,0s)}
.tile.mine.hit{box-shadow:0 0 40px var(--red);animation:flip .5s var(--ease),boom .6s .4s}
.tile.dim{opacity:.5}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8)}70%{transform:rotateY(-8deg) scale(1.1)}100%{transform:none}}
@keyframes boom{30%{transform:scale(1.35)}50%{transform:translateX(-6px)}70%{transform:translateX(6px)}}
/* slots */
.machine{background:linear-gradient(180deg,#2c0b40,#0e0b17);border:2px solid var(--gold);border-radius:28px;padding:24px;box-shadow:0 0 70px #ffc84a33,inset 0 0 50px #ff3fd822;max-width:540px;margin:0 auto;width:100%;position:relative;overflow:hidden}
.machine:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff10 50%,transparent 60%);animation:shine 5s infinite;pointer-events:none}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#04030a;padding:12px;border-radius:18px;border:1px solid var(--line)}
.reel{display:grid;gap:10px}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(34px,9vw,58px);border-radius:14px;background:linear-gradient(180deg,#1a1630,#0f0c1b);transition:.2s}
.reel.spin .cell{filter:blur(3px);animation:reelshake .12s linear infinite}
@keyframes reelshake{50%{transform:translateY(7px)}}
.reel.land .cell{animation:land .4s var(--ease)}@keyframes land{from{transform:translateY(-40px);opacity:.3}60%{transform:translateY(6px)}}
.cell.win{background:#ffc84a30;box-shadow:0 0 26px var(--gold);animation:wincell .7s ease-in-out infinite alternate}
@keyframes wincell{to{transform:scale(1.1)}}
/* dice / limbo / coin */
.track{position:relative;height:14px;border-radius:99px;background:var(--red);width:100%;margin:46px 0 14px}
.track .ok{position:absolute;top:0;bottom:0;background:var(--green);border-radius:99px;transition:.15s}
.track input{position:absolute;inset:-6px 0;width:100%;height:26px;background:none;z-index:2}
.marker{position:absolute;top:-38px;transform:translateX(-50%);transition:left .9s var(--ease);background:#fff;color:#111;font-weight:800;padding:2px 9px;border-radius:9px;font-size:13px;opacity:0;font-variant-numeric:tabular-nums}
.marker.show{opacity:1}.marker.win{background:var(--green)}.marker.lose{background:var(--red);color:#fff}
.marker:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:inherit;border-bottom:0}
.rollbig{font-family:var(--disp);font-size:clamp(60px,14vw,110px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s}
.coinwrap{perspective:900px;height:190px;display:grid;place-items:center}
.coin{width:150px;height:150px;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.coin div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:62px;backface-visibility:hidden;border:6px solid #b8860b;background:radial-gradient(circle at 30% 30%,#fff3b0,#ffc84a 55%,#b8860b);box-shadow:inset 0 0 22px #8a5a00,0 0 40px #ffc84a55}
.coin .t{transform:rotateY(180deg)}
.pbtn{display:flex;gap:10px}.pbtn .btn{flex:1}.pbtn .btn.sel{outline:3px solid #fff;outline-offset:2px}
canvas#pl{width:100%;max-width:620px;display:block}
/* misc */
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #ffffff0c}th{color:var(--mut);font-weight:600;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
tbody tr{animation:slidein .4s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.box{word-break:break-all;background:#0a0816;border:1px dashed var(--gold);border-radius:12px;padding:11px;margin:6px 0;font-family:ui-monospace,monospace;font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#1c1730;border:1px solid var(--cyan);padding:12px 20px;border-radius:14px;z-index:99;opacity:0;pointer-events:none;transition:.35s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--red)}
#fx{position:fixed;inset:0;z-index:98;pointer-events:none}
.bottomnav{display:none}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 #side{position:fixed;left:0;top:0;width:260px;transform:translateX(-105%);transition:.3s var(--ease);box-shadow:10px 0 50px #000}
 #side.open{transform:none}#burger{display:block}#top{padding:10px 14px}
 .play{grid-template-columns:1fr}.stage{min-height:340px}#main{padding:14px 14px 90px}.hero{padding:30px 22px}
 .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:#07050df2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bottomnav div{flex:1;text-align:center;padding:6px 0;font-size:10px;color:var(--mut);font-weight:700;cursor:pointer}.bottomnav i{display:block;font-style:normal;font-size:20px}
 .bottomnav div.on{color:var(--gold)}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="bgfx"><i></i><i></i><i></i></div><canvas id="fx"></canvas>
<div id="auth" class="hide"><div class="card">
 <svg class="sun" viewBox="0 0 100 100"><use href="#sunsym"/></svg><div class="disp">SOLSTICE</div><div class="mut" style="font-size:12px;letter-spacing:5px">CASINO</div>
 <div class="tabs" id="atabs"><button class="on" data-m="login">Sign in</button><button data-m="register">Create account</button></div>
 <form id="af" autocomplete="on">
  <div id="a1"><label>Email</label><input id="em" type="email" autocomplete="email" required>
   <label>Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <div id="a2" class="hide"><p class="mut" style="margin-top:14px">We emailed you a 6-digit code.</p><label>Code</label><input id="cd" inputmode="numeric" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:10px"></div>
  <button class="btn neon shine" id="abtn">Sign in</button><div class="err" id="aerr"></div>
 </form><p class="mut" style="font-size:11px;margin-top:8px">18+ only. Play responsibly.</p>
</div></div>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="sunsym" viewBox="0 0 100 100"><g stroke="#ffc84a" stroke-width="4" stroke-linecap="round">
<path d="M50 6v14M50 80v14M6 50h14M80 50h14M19 19l10 10M71 71l10 10M81 19L71 29M29 71L19 81"/></g><circle cx="50" cy="50" r="22" fill="url(#sg)"/><defs><radialGradient id="sg" cx=".35" cy=".3"><stop offset="0" stop-color="#fff3b0"/><stop offset=".6" stop-color="#ffc84a"/><stop offset="1" stop-color="#ff3fd8"/></radialGradient></defs></symbol></defs></svg>
<div id="app" class="hide">
 <aside id="side"><div class="brand"><svg viewBox="0 0 100 100"><use href="#sunsym"/></svg><b>SOLSTICE</b></div>
  <div class="nav on" data-v="lobby"><i>🏠</i>Lobby</div>
  <div class="navh">ORIGINALS</div>
  <div class="nav" data-v="mines"><i>💣</i>Mines</div>
  <div class="nav" data-v="plinko"><i>🔮</i>Plinko</div>
  <div class="nav" data-v="dice"><i>🎲</i>Dice</div>
  <div class="nav" data-v="limbo"><i>🚀</i>Limbo</div>
  <div class="nav" data-v="coin"><i>🪙</i>Coin Flip</div>
  <div class="navh">SLOTS</div>
  <div class="nav" data-v="slots"><i>🎰</i>Solstice Slots</div>
  <div class="navh">ACCOUNT</div>
  <div class="nav" data-v="wallet"><i>👛</i>Wallet</div>
  <div class="nav" data-v="history"><i>🧾</i>My bets</div>
  <div class="nav hide" data-v="admin"><i>🛡️</i>Admin</div>
  <div class="sp"></div><div class="mut" id="who" style="font-size:12px;padding:0 10px;word-break:break-all"></div>
  <div class="nav" id="logout"><i>🚪</i>Sign out</div></aside>
 <div><div id="top"><button id="burger">☰</button><div class="grow"></div>
  <div id="wchip" title="Wallet"><span>👛</span><b id="bal">$0.00</b><span class="plus">+</span></div></div>
  <div id="main"></div></div>
 <nav class="bottomnav"><div data-v="lobby" class="on"><i>🏠</i>Lobby</div><div data-v="mines"><i>💣</i>Mines</div><div data-v="plinko"><i>🔮</i>Plinko</div><div data-v="slots"><i>🎰</i>Slots</div><div data-v="wallet"><i>👛</i>Wallet</div></nav>

<script>

   cx.beginPath();cx.roundRect(-w/2,0,w,h,6);cx.fill();cx.shadowBlur=0;cx.globalAlpha=1;cx.fillStyle='#10081c';cx.font='700 '+(rows>12?9:11)+'px Sora,sans-serif';cx.textAlign='center';cx.fillText(m>=100?Math.round(m):m>=10?m.toFixed(0):m,0,17);cx.restore()});
  balls=balls.filter(b=>{const e=t-b.t0,s=Math.min(rows,e/105),i=Math.floor(s),f=s-i;if(s>=rows){flash[b.k]=t;if(!b.done){b.done=1;b.cb()}return t-b.t0<rows*105+250}
   const pos=n=>b.px[n],x0=pos(i),x1=pos(i+1),x=x0+(x1-x0)*(1-Math.pow(1-f,2)),y=g.top+(i+f)*g.dy-Math.sin(f*Math.PI)*12;
   cx.beginPath();cx.arc(x,y-6,8,0,7);cx.fillStyle='#ffc84a';cx.shadowColor='#ffc84a';cx.shadowBlur=18;cx.fill();cx.shadowBlur=0;return true});
  requestAnimationFrame(draw)};
 const load=async()=>{table=await api(`plinko/table?rows=${rows}&risk=${risk}`);};
 await load();requestAnimationFrame(draw);
 $$('#prisk button').forEach(b=>b.onclick=async()=>{risk=b.dataset.r;$$('#prisk button').forEach(x=>x.classList.toggle('on',x===b));await load()});

 $('#pgo').onclick=guard(async()=>{lockUI(true,['pgo']);let r;try{r=await api('plinko/drop',{bet:$('#bet').value,rows,risk})}catch(e){lockUI(false,['pgo']);throw e}
  const g=geo();let sum=0;const px=[W/2];r.path.forEach(p=>{sum+=p;px.push(W/2+(sum-(px.length+1)/2)*g.dx)});
  await new Promise(done=>balls.push({t0:performance.now(),px,k:r.bucket,cb:async()=>{const w=$('#pwin');w.className='winbar '+(r.mult>=1?'green':'red');w.textContent=`${r.mult}× · ${r.payout>0?'+'+money(r.payout):'$0.00'}`;
   await refreshMe();celebrate(r.payout,r.bet);done()}}));lockUI(false,['pgo'])})};
